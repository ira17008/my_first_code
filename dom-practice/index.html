<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DOM практика</title>
</head>
<body>
    <h1 id="title">Привет, мир!</h1>
    <p class="text">Первый параграф</p>
    <p class="text">Второй параграф</p>
    <button id="btn">Нажми меня</button>

    <button id="clickBtn">Нажми меня</button>
    <input type="text" id="nameInput" placeholder="Введите имя">
    <p id="output"></p>

    <button id="counterBtn">Кликни меня</button>
    <p id="count">0</p>

    <button id="colorBtn">Сменить цвет</button>
    <div id="box" style="width: 100px; height: 100px; background: gray; margin-top: 10px;"></div>

    <button id="toggleBtn">Показать/скрыть</button>
    <p id="secret">Секретнйы текст</p>

    <form id="myForm">
        <input type="text" id="taskInput" placeholder="Новая задача">
        <button type="submit">Добавить</button>
        <button type="submit">Удалить</button>
    </form>
    <ul id="taskList"></ul>
    <p id="counter">Задач : 0</p>
    <script src="script.js"></script>
</body>
</html>
